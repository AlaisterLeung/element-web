# Builds installable Element Desktop packages (Linux) from this fork.
#
# Fork-specific glue around upstream's reusable desktop pipeline. Split out of
# build-desktop-fork.yaml so a single platform can be rebuilt without paying for the others.
#   webapp (this file) -> build_desktop_prepare -> build_desktop_linux
#
# Notes:
#   - version: develop makes prepare skip its release-fetch steps (fork has no matching releases).
#   - test: true runs upstream's Playwright suite against the packaged app.
name: Build Desktop Packages (Fork, Linux)
on:
    workflow_dispatch: {}
permissions: {}
env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes
jobs:
    webapp:
        name: Build webapp
        runs-on: ubuntu-24.04
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  cache: pnpm
                  node-version: lts/*

            - name: Fetch layered build
              run: ./scripts/layered.sh

            - name: Copy config
              working-directory: apps/web
              run: cp element.io/develop/config.json config.json

            - name: Build
              working-directory: apps/web
              env:
                  CI_PACKAGE: true
              run: VERSION=$(scripts/get-version-from-git.sh) pnpm run build

            - name: Upload Artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: webapp-fork
                  path: apps/web/webapp

    prepare:
        name: Prepare desktop build
        needs: webapp
        permissions:
            contents: read
        uses: ./.github/workflows/build_desktop_prepare.yaml
        with:
            config: atxoft.com
            version: develop
            webapp-artifact: webapp-fork

    linux:
        name: Linux amd64
        needs: prepare
        uses: ./.github/workflows/build_desktop_linux.yaml
        with:
            arch: amd64
            sqlcipher: static
            targets: tar.gz deb AppImage
            test: true
